; BMW E90 N43B20A - CAN Bus Gauge Display (LVGL / AMOLED)
; Hardware: Waveshare ESP32-C6 1.43" AMOLED Touch (SH8601, QSPI) + eingebauter TWAI-CAN + microSD

[env:esp32-c6-devkitc-1]
; Die offizielle PlatformIO-espressif32-Plattform unterstuetzt das
; esp32-c6-devkitc-1-Board (noch) nicht mit dem Arduino-Framework
; ("Error: This board doesn't support arduino framework!").
; Daher wird der "pioarduino"-Community-Fork verwendet, der ESP32-C6 mit
; aktuellem Arduino-ESP32-Core 3.x (ESP-IDF 5.x) unterstuetzt.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

; Das Board-File esp32-c6-devkitc-1.json geht von 8MB Flash und der
; Standard-Partitionstabelle (kleine Dual-OTA-Slots) aus. Laut offizieller
; Waveshare-Arduino-IDE-Konfiguration (Tools Configuration.png) hat das
; Modul tatsaechlich 16MB Flash mit dem Schema "Huge APP (3MB No OTA/1MB
; SPIFFS)" - ohne diese Ueberschreibung baut/flasht PlatformIO mit falscher
; Flash-Groesse und einer abweichenden Partitionstabelle.
board_upload.flash_size  = 16MB
board_build.partitions   = huge_app.csv

lib_deps =
    lvgl/lvgl @ ^8.3.11
    bodmer/TJpg_Decoder @ ^1.1.0

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; Serial ueber den eingebauten USB-Serial/JTAG ausgeben (statt UART0-Pins),
    ; damit App-Meldungen und Panic-Backtraces am USB-Port sichtbar sind.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
