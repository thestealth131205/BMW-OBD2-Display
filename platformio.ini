; BMW E90 N43B20A - CAN Bus Gauge Display (LVGL / AMOLED)
; Hardware: Waveshare ESP32-C6 1.43" AMOLED Touch (CO5300, QSPI) + eingebauter TWAI-CAN + microSD

[env:esp32-c6-devkitc-1]
platform  = espressif32
board     = esp32-c6-devkitc-1
framework = arduino

; HINWEIS: ESP32-C6 benoetigt Arduino-ESP32-Core 3.x (ESP-IDF 5.x).
; Falls die offizielle PlatformIO-espressif32-Plattform kein esp32-c6-devkitc-1
; mit ausreichend aktuellem Core bereitstellt, den "pioarduino"-Fork nutzen:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/<version>/platform-espressif32.zip

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.7
    lvgl/lvgl @ ^8.3.11
    bodmer/TJpg_Decoder @ ^1.1.0

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
