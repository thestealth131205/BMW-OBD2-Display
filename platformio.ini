; BMW E90 N43B20A - CAN Bus Gauge Display (LVGL / AMOLED)
; Hardware: Waveshare ESP32-C6 1.43" AMOLED Touch (CO5300, QSPI) + eingebauter TWAI-CAN + microSD

[env:esp32-c6-devkitc-1]
; Die offizielle PlatformIO-espressif32-Plattform unterstuetzt das
; esp32-c6-devkitc-1-Board (noch) nicht mit dem Arduino-Framework
; ("Error: This board doesn't support arduino framework!").
; Daher wird der "pioarduino"-Community-Fork verwendet, der ESP32-C6 mit
; aktuellem Arduino-ESP32-Core 3.x (ESP-IDF 5.x) unterstuetzt.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.7
    lvgl/lvgl @ ^8.3.11
    bodmer/TJpg_Decoder @ ^1.1.0

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
