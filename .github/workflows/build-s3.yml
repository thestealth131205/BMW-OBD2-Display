name: ESP-IDF S3 Build

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  PROJECT_DIR: "2.1 LCD/demo projekt/esp-idf - ESP32-S3-Touch-LCD-2.1-Test"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s3
          path: ${{ env.PROJECT_DIR }}

      - name: Collect build artifacts
        run: |
          BUILD_DIR="$PROJECT_DIR/build"
          mkdir -p s3-artifacts
          cp "$BUILD_DIR/ESP32-S3-Touch-LCD-2.1.bin" s3-artifacts/firmware-s3.bin
          cp "$BUILD_DIR/ESP32-S3-Touch-LCD-2.1.elf" s3-artifacts/firmware-s3.elf
          cp "$BUILD_DIR/bootloader/bootloader.bin"   s3-artifacts/bootloader.bin
          cp "$BUILD_DIR/partition_table/partition-table.bin" s3-artifacts/partition-table.bin

      - name: Merge into single flashable image
        run: |
          BUILD_DIR="$PROJECT_DIR/build"
          pip install --upgrade esptool
          esptool --chip esp32s3 merge_bin -o s3-artifacts/firmware-s3-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     "$BUILD_DIR/bootloader/bootloader.bin" \
            0x8000  "$BUILD_DIR/partition_table/partition-table.bin" \
            0x10000 "$BUILD_DIR/ESP32-S3-Touch-LCD-2.1.bin"

      - name: Read firmware version
        id: ver
        run: |
          VER=$(tr -d ' \r\n' < "$PROJECT_DIR/VERSION")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p s3-versioned
          for f in firmware-s3.bin firmware-s3.elf firmware-s3-merged.bin; do
            cp "s3-artifacts/$f" "s3-versioned/${f/firmware-s3/firmware-s3-v$VER}"
          done

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-s3
          path: s3-artifacts/

      - name: Move release tag to current commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/test_waveshare'
        run: |
          git tag -f s3-latest "$GITHUB_SHA"
          git push -f origin refs/tags/s3-latest

      - name: Write release notes from last commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/test_waveshare'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\nCommit: %s\n' "$COMMIT_MSG" "$GITHUB_SHA" > release-notes.md

      - name: Create/Update versioned Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/test_waveshare'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: S3 v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          make_latest: false
          files: |
            s3-versioned/*

      - name: Create/Update Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/test_waveshare'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s3-latest
          name: Latest S3 Build
          body_path: release-notes.md
          make_latest: false
          files: |
            s3-artifacts/firmware-s3.bin
            s3-artifacts/firmware-s3.elf
            s3-artifacts/firmware-s3-merged.bin
