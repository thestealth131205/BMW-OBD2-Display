name: PlatformIO Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Install esptool
        run: pip install --upgrade esptool

      - name: Merge into single flashable image
        run: |
          BUILD_DIR=.pio/build/esp32-c6-devkitc-1
          BOOT_APP0="$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)"
          ARGS=(--chip esp32c6 merge_bin -o "$BUILD_DIR/firmware-merged.bin"
                --flash_mode keep --flash_freq keep --flash_size keep
                0x0 "$BUILD_DIR/bootloader.bin"
                0x8000 "$BUILD_DIR/partitions.bin"
                0x10000 "$BUILD_DIR/firmware.bin")
          if [ -n "$BOOT_APP0" ]; then
            ARGS+=(0xe000 "$BOOT_APP0")
          fi
          esptool "${ARGS[@]}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-c6
          path: |
            .pio/build/esp32-c6-devkitc-1/firmware.bin
            .pio/build/esp32-c6-devkitc-1/firmware.elf
            .pio/build/esp32-c6-devkitc-1/firmware-merged.bin

      - name: Create/Update Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            .pio/build/esp32-c6-devkitc-1/firmware.bin
            .pio/build/esp32-c6-devkitc-1/firmware.elf
            .pio/build/esp32-c6-devkitc-1/firmware-merged.bin
